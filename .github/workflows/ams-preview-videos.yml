name: AMS preview explainer videos

on:
  push:
    branches:
      - design/ams-next-brand-system-20261022
    paths:
      - scripts/render-ams-videos.py
      - .github/workflows/ams-preview-videos.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ams-preview-media-${{ github.ref }}
  cancel-in-progress: false

jobs:
  render-video-assets:
    if: github.repository == 'Bagelwaffles/aspect-ai-webview-app' && github.ref == 'refs/heads/design/ams-next-brand-system-20261022'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install self-contained media rendering dependency
        run: python -m pip install pillow==12.0.0
      - name: Render original AMS motion graphics, posters and text tracks
        run: |
          ffmpeg -version | head -n 1
          python scripts/render-ams-videos.py public/videos
          for name in ams-introduction ams-content-agent ams-lead-magnet-agent ams-nurture-agent; do
            test -s "public/videos/${name}.mp4"
            test -s "public/videos/${name}.vtt"
            test -s "public/videos/${name}-poster.jpg"
            test "$(stat -c%s "public/videos/${name}.mp4")" -lt 5000000
            ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of default=noprint_wrappers=1 "public/videos/${name}.mp4" | grep -qx 'codec_name=h264'
          done
      - name: Commit generated assets to existing preview branch only
        shell: bash
        run: |
          set -euo pipefail
          git add -- public/videos/ams-*.mp4 public/videos/ams-*.vtt public/videos/ams-*-poster.jpg
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'feat(media): add original AMS intro and agent videos'
            git push origin HEAD:refs/heads/design/ams-next-brand-system-20261022
          else
            echo 'Media already matches generated output'
          fi
