name: Probe Content Agent Gateway Key Schema

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/probe-content-agent-gateway-schema.yml"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: ams-content-agent-gateway-schema-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      VERCEL_ORG_ID: team_tyt9FpAEguBeBOiFqBMO3ZCg
      VERCEL_PROJECT_ID: prj_ovsfsfElhC0eywpVlk3dHSBi4qFZ
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Create sanitized probe issue
        id: issue
        shell: bash
        run: |
          set -euo pipefail
          issue_url=$(gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "AMS Gateway Schema Probe #${GITHUB_RUN_ID}" \
            --body "Sanitized AI Gateway key-response schema probe. No secret values are reported, no model request is made, and all temporary AMS Content Agent keys are deleted before completion.")
          echo "number=${issue_url##*/}" >> "$GITHUB_OUTPUT"

      - name: Verify Vercel credential and clean prior temporary keys
        id: preclean
        shell: bash
        env:
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
        run: |
          set -euo pipefail
          set +x
          [ -n "${VERCEL_TOKEN:-}" ] || exit 20

          delete_named_keys() {
            local list_http
            list_http=$(curl --max-time 15 --silent --show-error \
              --output /tmp/keys.json --write-out '%{http_code}' \
              "https://api.vercel.com/v1/api-keys?teamId=${VERCEL_ORG_ID}&purpose=ai-gateway" \
              --header "Authorization: Bearer ${VERCEL_TOKEN}" || true)
            [ "$list_http" = "200" ] || return 1

            node <<'NODE' > /tmp/delete-ids.txt
          const fs=require('fs')
          const j=JSON.parse(fs.readFileSync('/tmp/keys.json','utf8'))
          const list=Array.isArray(j)?j:(Array.isArray(j.apiKeys)?j.apiKeys:(Array.isArray(j.data)?j.data:[]))
          const pid=process.env.VERCEL_PROJECT_ID
          for(const k of list){
            if(!k||k.name!=='AMS Content Agent') continue
            const projectId=k.projectId ?? k.project?.id ?? null
            if(projectId && projectId!==pid) continue
            const id=k.id ?? k.keyId ?? k.apiKeyId
            if(typeof id==='string' && id) console.log(id)
          }
          NODE

            local deleted=0 code id
            while IFS= read -r id; do
              [ -n "$id" ] || continue
              echo "::add-mask::$id"
              code=$(curl --max-time 15 --silent --show-error \
                --output /dev/null --write-out '%{http_code}' \
                --request DELETE \
                "https://api.vercel.com/v1/api-keys/${id}?teamId=${VERCEL_ORG_ID}" \
                --header "Authorization: Bearer ${VERCEL_TOKEN}" || true)
              if [ "$code" = "200" ] || [ "$code" = "204" ]; then
                deleted=$((deleted+1))
              else
                return 2
              fi
            done < /tmp/delete-ids.txt
            printf '%s' "$deleted"
          }

          deleted=$(delete_named_keys)
          echo "deleted=$deleted" >> "$GITHUB_OUTPUT"
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "Pre-clean completed. Temporary/unusable AMS Content Agent keys removed: ${deleted}."

      - name: Create temporary capped key and report schema only
        id: create
        shell: bash
        env:
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
        run: |
          set -euo pipefail
          set +x

          node <<'NODE'
          const fs=require('fs')
          fs.writeFileSync('/tmp/key-request.json',JSON.stringify({
            purpose:'ai-gateway',
            name:'AMS Content Agent',
            projectId:process.env.VERCEL_PROJECT_ID,
            aiGatewayQuota:{limitAmount:1,refreshPeriod:'monthly'},
          }))
          NODE

          create_http=$(curl --max-time 15 --silent --show-error \
            --output /tmp/key-response.json --write-out '%{http_code}' \
            --request POST \
            "https://api.vercel.com/v1/api-keys?teamId=${VERCEL_ORG_ID}" \
            --header "Authorization: Bearer ${VERCEL_TOKEN}" \
            --header "Content-Type: application/json" \
            --data-binary @/tmp/key-request.json || true)
          echo "http=$create_http" >> "$GITHUB_OUTPUT"
          [ "$create_http" = "200" ] || [ "$create_http" = "201" ] || exit 21

          node <<'NODE' > /tmp/schema.txt
          const fs=require('fs')
          const j=JSON.parse(fs.readFileSync('/tmp/key-response.json','utf8'))
          const rows=[]
          const walk=(v,path)=>{
            if(v===null){rows.push(`${path}: null`);return}
            if(Array.isArray(v)){rows.push(`${path}: array(${v.length})`);v.forEach((x,i)=>walk(x,`${path}[${i}]`));return}
            if(typeof v==='object'){rows.push(`${path}: object`);for(const [k,x] of Object.entries(v))walk(x,`${path}.${k}`);return}
            if(typeof v==='string'){rows.push(`${path}: string(length=${v.length})`);return}
            rows.push(`${path}: ${typeof v}`)
          }
          walk(j,'response')
          process.stdout.write(rows.join('\n'))
          NODE

          schema=$(cat /tmp/schema.txt)
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "Key creation HTTP=${create_http}. Sanitized response schema (paths/types/lengths only; no values):

\`\`\`
${schema}
\`\`\`"

      - name: Delete all temporary AMS Content Agent keys
        id: cleanup
        if: always()
        shell: bash
        env:
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
        run: |
          set +e
          set +x
          list_http=$(curl --max-time 15 --silent --show-error \
            --output /tmp/keys-after.json --write-out '%{http_code}' \
            "https://api.vercel.com/v1/api-keys?teamId=${VERCEL_ORG_ID}&purpose=ai-gateway" \
            --header "Authorization: Bearer ${VERCEL_TOKEN}" || true)
          if [ "$list_http" != "200" ]; then
            gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "Cleanup could not list Gateway keys (HTTP ${list_http}). No model request occurred."
            exit 1
          fi

          node <<'NODE' > /tmp/delete-after.txt
          const fs=require('fs')
          const j=JSON.parse(fs.readFileSync('/tmp/keys-after.json','utf8'))
          const list=Array.isArray(j)?j:(Array.isArray(j.apiKeys)?j.apiKeys:(Array.isArray(j.data)?j.data:[]))
          const pid=process.env.VERCEL_PROJECT_ID
          for(const k of list){
            if(!k||k.name!=='AMS Content Agent') continue
            const projectId=k.projectId ?? k.project?.id ?? null
            if(projectId && projectId!==pid) continue
            const id=k.id ?? k.keyId ?? k.apiKeyId
            if(typeof id==='string' && id) console.log(id)
          }
          NODE

          deleted=0
          failed=0
          while IFS= read -r id; do
            [ -n "$id" ] || continue
            echo "::add-mask::$id"
            code=$(curl --max-time 15 --silent --show-error \
              --output /dev/null --write-out '%{http_code}' \
              --request DELETE \
              "https://api.vercel.com/v1/api-keys/${id}?teamId=${VERCEL_ORG_ID}" \
              --header "Authorization: Bearer ${VERCEL_TOKEN}" || true)
            if [ "$code" = "200" ] || [ "$code" = "204" ]; then
              deleted=$((deleted+1))
            else
              failed=$((failed+1))
            fi
          done < /tmp/delete-after.txt

          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "Probe cleanup complete. Temporary AMS Content Agent keys deleted: ${deleted}; deletion failures: ${failed}. No model request or customer charge occurred."
          [ "$failed" = "0" ]
