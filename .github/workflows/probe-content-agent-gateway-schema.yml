name: Probe Content Agent Gateway Key Schema

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/probe-content-agent-gateway-schema.yml"
      - "scripts/ops/probe-content-agent-gateway-schema.sh"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/probe-content-agent-gateway-schema.yml"
      - "scripts/ops/probe-content-agent-gateway-schema.sh"

permissions:
  contents: read
  issues: write

concurrency:
  group: ams-content-agent-gateway-schema-probe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  registration-check:
    name: registration-check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Confirm workflow registration
        run: echo "Gateway probe workflow registered successfully."

  probe:
    name: probe
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      VERCEL_ORG_ID: "team_tyt9FpAEguBeBOiFqBMO3ZCg"
      VERCEL_PROJECT_ID: "prj_ovsfsfElhC0eywpVlk3dHSBi4qFZ"
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      GH_TOKEN: ${{ github.token }}
      PROBE_KEY_NAME: "AMS Content Agent Probe ${{ github.run_id }}-${{ github.run_attempt }}"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run sanitized Gateway key schema probe
        shell: bash
        run: bash scripts/ops/probe-content-agent-gateway-schema.sh
