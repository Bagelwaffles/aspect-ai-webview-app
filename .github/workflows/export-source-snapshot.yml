name: Export AMS source snapshot

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/export-source-snapshot.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Build source archive
        run: git archive --format=tar.gz --output="$RUNNER_TEMP/ams-source.tar.gz" HEAD

      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: ams-source-${{ github.sha }}
          path: ${{ runner.temp }}/ams-source.tar.gz
          if-no-files-found: error
          retention-days: 1
