name: Complete AMS Stripe subscription wiring

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/complete-stripe-subscription-wiring.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ams-stripe-subscription-wiring
  cancel-in-progress: false

jobs:
  configure:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      VERCEL_ORG_ID: team_tyt9FpAEguBeBOiFqBMO3ZCg
      VERCEL_PROJECT_ID: prj_ovsfsfElhC0eywpVlk3dHSBi4qFZ
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      AMS_STARTER_PRICE_ID: price_1T6oGBGloGM6sjzBGE9YqQ6x
      AMS_GROWTH_PRICE_ID: price_1T6oGHGloGM6sjzBnBwD80lD
      AMS_PRO_PRICE_ID: price_1T6oGNGloGM6sjzBRlOT3PTP
      AMS_OLD_WEBHOOK_ENDPOINT_ID: we_1TrEnyGloGM6sjzB3NqmapFL
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Require Vercel credential
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::VERCEL_TOKEN is not configured."
            exit 1
          fi

      - name: Pull production environment without printing values
        run: npx --yes vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Verify live Stripe key and approved recurring prices
        shell: bash
        run: |
          set -euo pipefail
          set +x
          set -a
          source .vercel/.env.production.local
          set +a
          : "${STRIPE_SECRET_KEY:?STRIPE_SECRET_KEY is missing}"
          if [[ "$STRIPE_SECRET_KEY" != sk_live_* ]]; then
            echo "::error::Production Stripe key is not a live secret key."
            exit 1
          fi
          for price_id in "$AMS_STARTER_PRICE_ID" "$AMS_GROWTH_PRICE_ID" "$AMS_PRO_PRICE_ID"; do
            code=$(curl --max-time 10 --silent --show-error --output /tmp/price.json --write-out '%{http_code}' \
              -u "${STRIPE_SECRET_KEY}:" "https://api.stripe.com/v1/prices/${price_id}")
            if [ "$code" != "200" ]; then
              echo "::error::Approved recurring price lookup failed with HTTP $code."
              exit 1
            fi
            PRICE_ID="$price_id" node --input-type=module - <<'NODE'
            import fs from 'node:fs'
            const price = JSON.parse(fs.readFileSync('/tmp/price.json', 'utf8'))
            if (price.id !== process.env.PRICE_ID || price.active !== true || price.livemode !== true || price.type !== 'recurring' || price.recurring?.interval !== 'month' || price.recurring?.interval_count !== 1) {
              console.error('Approved price failed the live monthly recurring safety check.')
              process.exit(1)
            }
            console.log(`Verified live monthly recurring price ${price.id} at $${(price.unit_amount / 100).toFixed(2)}/month.`)
            NODE
          done

      - name: Create replacement Stripe webhook endpoint without exposing its secret
        id: create_webhook
        shell: bash
        run: |
          set -euo pipefail
          set +x
          set -a
          source .vercel/.env.production.local
          set +a
          STRIPE_SECRET_KEY="$STRIPE_SECRET_KEY" node --input-type=module - <<'NODE'
          import fs from 'node:fs'

          const body = new URLSearchParams()
          body.set('url', 'https://www.aspectmarketingsolutions.app/api/webhooks/stripe')
          body.set('description', 'AMS production subscription webhook - rotated 2026-08-09')
          const events = [
            'checkout.session.completed',
            'customer.subscription.created',
            'customer.subscription.updated',
            'customer.subscription.deleted',
            'invoice.payment_succeeded',
            'invoice.payment_failed',
          ]
          events.forEach((event, index) => body.set(`enabled_events[${index}]`, event))

          const response = await fetch('https://api.stripe.com/v1/webhook_endpoints', {
            method: 'POST',
            headers: {
              authorization: `Bearer ${process.env.STRIPE_SECRET_KEY}`,
              'content-type': 'application/x-www-form-urlencoded',
            },
            body,
          })
          const payload = await response.json()
          if (!response.ok || !payload.id || !payload.secret) {
            console.error(`Stripe webhook creation failed with HTTP ${response.status}.`)
            process.exit(1)
          }
          fs.writeFileSync('/tmp/ams-stripe-webhook-id', payload.id, { mode: 0o600 })
          fs.writeFileSync('/tmp/ams-stripe-webhook-secret', payload.secret, { mode: 0o600 })
          fs.appendFileSync(process.env.GITHUB_ENV, `AMS_NEW_WEBHOOK_ENDPOINT_ID=${payload.id}\n`)
          console.log(`Created replacement Stripe webhook endpoint ${payload.id}; signing secret retained only in the runner.`)
          NODE

      - name: Upsert production Stripe billing variables in Vercel
        shell: bash
        run: |
          set -euo pipefail
          set +x
          webhook_secret=$(cat /tmp/ams-stripe-webhook-secret)
          STRIPE_WEBHOOK_SECRET_VALUE="$webhook_secret" node --input-type=module - <<'NODE'
          const endpoint = new URL(`https://api.vercel.com/v10/projects/${process.env.VERCEL_PROJECT_ID}/env`)
          endpoint.searchParams.set('teamId', process.env.VERCEL_ORG_ID)
          endpoint.searchParams.set('upsert', 'true')

          const variables = [
            ['STRIPE_WEBHOOK_SECRET', process.env.STRIPE_WEBHOOK_SECRET_VALUE, 'sensitive'],
            ['AMS_STRIPE_WEBHOOK_MODE', 'live', 'plain'],
            ['AMS_STRIPE_STARTER_PRICE_ID', process.env.AMS_STARTER_PRICE_ID, 'plain'],
            ['AMS_STRIPE_GROWTH_PRICE_ID', process.env.AMS_GROWTH_PRICE_ID, 'plain'],
            ['AMS_STRIPE_PRO_PRICE_ID', process.env.AMS_PRO_PRICE_ID, 'plain'],
          ]
          const body = variables.map(([key, value, type]) => ({
            key,
            value,
            type,
            target: ['production'],
            comment: 'AMS verified live Stripe subscription wiring',
          }))

          const response = await fetch(endpoint, {
            method: 'POST',
            headers: {
              authorization: `Bearer ${process.env.VERCEL_TOKEN}`,
              'content-type': 'application/json',
            },
            body: JSON.stringify(body),
          })
          if (!response.ok) {
            console.error(`Vercel Stripe environment upsert failed with HTTP ${response.status}.`)
            process.exit(1)
          }
          console.log('Production Stripe webhook mode and Starter/Growth/Pro price mappings were configured without exposing secret values.')
          NODE

      - name: Deploy production with completed Stripe wiring
        run: npx --yes vercel@latest deploy --prod --yes --token="$VERCEL_TOKEN"

      - name: Verify Stripe webhook readiness and production health
        shell: bash
        run: |
          set -euo pipefail
          ready=false
          for attempt in 1 2 3 4 5 6 7 8; do
            webhook_code=$(curl --max-time 12 --silent --show-error --output /tmp/webhook-health.json --write-out '%{http_code}' \
              https://www.aspectmarketingsolutions.app/api/webhooks/stripe || true)
            health_code=$(curl --max-time 12 --silent --show-error --output /tmp/app-health.json --write-out '%{http_code}' \
              https://www.aspectmarketingsolutions.app/api/health || true)
            if [ "$webhook_code" = "200" ] && [ "$health_code" = "200" ]; then
              if node --input-type=module - <<'NODE'
              import fs from 'node:fs'
              const webhook = JSON.parse(fs.readFileSync('/tmp/webhook-health.json', 'utf8'))
              const health = JSON.parse(fs.readFileSync('/tmp/app-health.json', 'utf8'))
              if (webhook.configured !== true) process.exit(1)
              if (health.persistence?.redis?.status !== 'ready') process.exit(1)
              if (health.dependencies?.stripeBilling !== 'configured') process.exit(1)
              console.log('Stripe webhook: configured')
              console.log('Stripe billing bundle: configured')
              console.log(`Redis: ${health.persistence.redis.status}`)
              console.log(`Production commit: ${health.commit}`)
              NODE
              then
                ready=true
                break
              fi
            fi
            echo "Readiness attempt $attempt not complete yet; waiting for production propagation."
            sleep 10
          done
          if [ "$ready" != true ]; then
            echo "::error::Stripe billing wiring did not become production-ready."
            cat /tmp/webhook-health.json 2>/dev/null || true
            cat /tmp/app-health.json 2>/dev/null || true
            exit 1
          fi

      - name: Disable superseded Stripe webhook endpoint
        shell: bash
        run: |
          set -euo pipefail
          set +x
          set -a
          source .vercel/.env.production.local
          set +a
          code=$(curl --max-time 10 --silent --show-error --output /tmp/old-webhook.json --write-out '%{http_code}' \
            -X POST \
            -u "${STRIPE_SECRET_KEY}:" \
            -d disabled=true \
            "https://api.stripe.com/v1/webhook_endpoints/${AMS_OLD_WEBHOOK_ENDPOINT_ID}")
          if [ "$code" != "200" ]; then
            echo "::error::Superseded webhook endpoint could not be disabled (HTTP $code)."
            exit 1
          fi
          echo "Superseded production webhook endpoint disabled after replacement became ready."

      - name: Clean up replacement webhook if configuration failed
        if: failure() && steps.create_webhook.outcome == 'success'
        shell: bash
        run: |
          set +e
          set +x
          set -a
          source .vercel/.env.production.local
          set +a
          if [ -n "${AMS_NEW_WEBHOOK_ENDPOINT_ID:-}" ]; then
            curl --max-time 10 --silent --output /dev/null \
              -X POST \
              -u "${STRIPE_SECRET_KEY}:" \
              -d disabled=true \
              "https://api.stripe.com/v1/webhook_endpoints/${AMS_NEW_WEBHOOK_ENDPOINT_ID}"
            echo "Replacement webhook endpoint disabled because configuration did not complete."
          fi

      - name: Safety assertion
        if: success()
        run: |
          echo "Stripe subscription wiring is configured, but paid AI checkout remains independently gated by NEXT_PUBLIC_AMS_CONTENT_AGENT_LIVE."
          echo "This workflow does not enable Content Agent billing or charge a customer."
