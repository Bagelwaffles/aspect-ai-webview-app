name: AMS Android Play CI

on:
  pull_request:
    branches:
      - main
    paths:
      - "android/**"
      - ".github/workflows/android-play-ci.yml"
  push:
    branches:
      - main
    paths:
      - "android/**"
      - ".github/workflows/android-play-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ams-android-play-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android API 36 toolchain
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Install Gradle 9.5.0
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            https://services.gradle.org/distributions/gradle-9.5.0-bin.zip \
            --output /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          /tmp/gradle-9.5.0/bin/gradle --version

      - name: Policy guardrails
        shell: bash
        run: |
          set -euo pipefail
          test "$(grep -c "applicationId 'com.aspectmarketingsolutions.app'" android/app/build.gradle)" -eq 1
          test "$(grep -c "namespace 'com.aspectmarketingsolutions.app'" android/app/build.gradle)" -eq 1
          test "$(grep -c 'targetSdk 36' android/app/build.gradle)" -eq 1
          test "$(grep -c 'compileSdk 36' android/app/build.gradle)" -eq 1
          test "$(grep -c 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml)" -eq 1
          if grep -RInE 'android\.webkit\.WebView|setAllowFileAccess|MIXED_CONTENT_ALWAYS_ALLOW|book\.stripe\.com|/api/billing/checkout|STRIPE_' android/app/src/main; then
            echo "::error::Play v1 contains a forbidden WebView or payment surface."
            exit 1
          fi
          if grep -RInE 'CAMERA|RECORD_AUDIO|ACCESS_FINE_LOCATION|READ_CONTACTS|WRITE_CONTACTS|READ_SMS|CALL_PHONE|READ_EXTERNAL_STORAGE|WRITE_EXTERNAL_STORAGE' android/app/src/main/AndroidManifest.xml; then
            echo "::error::Play v1 requests an unapproved sensitive permission."
            exit 1
          fi
          echo "Consumption-only guardrails passed."

      - name: Lint and build APK/AAB
        shell: bash
        run: |
          set -euo pipefail
          /tmp/gradle-9.5.0/bin/gradle -p android \
            --no-daemon \
            clean lintRelease assembleDebug assembleRelease bundleRelease

      - name: Verify built package and target SDK
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find android/app/build/outputs/apk/release -name '*.apk' | head -1)
          if [ -z "$APK" ]; then
            echo "::error::Release APK was not produced."
            exit 1
          fi
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          BADGING=$($AAPT dump badging "$APK")
          echo "$BADGING" | grep -F "package: name='com.aspectmarketingsolutions.app'"
          echo "$BADGING" | grep -F "targetSdkVersion:'36'"
          echo "$BADGING" | grep -F "application-label:'Aspect Marketing Solutions'"
          echo "Release package identity and target SDK verified."

      - name: Verify release bundle exists
        shell: bash
        run: |
          set -euo pipefail
          test -s android/app/build/outputs/bundle/release/app-release.aab
          ls -lh android/app/build/outputs/bundle/release/app-release.aab

      - name: Upload unsigned release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ams-android-play-v1-unsigned
          if-no-files-found: error
          retention-days: 14
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/reports/lint-results-release.html

      - name: Release status
        run: |
          echo "Build passed. Artifacts are intentionally unsigned until the Play upload-key reset/identity is completed."
