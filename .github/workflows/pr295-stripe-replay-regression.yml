name: PR295 Stripe replay regression

on:
  push:
    branches:
      - feat/audit-delivery-security-preview-20261023
    paths:
      - .github/workflows/pr295-stripe-replay-regression.yml
      - tests/stripe-event-idempotency.test.ts
      - lib/server/entitlements.ts
      - vercel.json
      - tests/owner-audit-pilot-vercel-routing.test.ts
      - tests/owner-audit-pilot-domain-guard.test.ts

permissions:
  contents: read

jobs:
  replay-regression:
    name: Isolated Stripe replay test
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.28.0 --activate
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Run isolated replay regression
        run: node --import tsx --test tests/stripe-event-idempotency.test.ts tests/owner-audit-pilot-vercel-routing.test.ts tests/owner-audit-pilot-domain-guard.test.ts
