name: Twitch Short Render Worker

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: read

concurrency:
  group: twitch-short-render-worker
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AMS_MEDIA_WORKER_KEY: ${{ secrets.AMS_MEDIA_WORKER_KEY }}
      AMS_APP_URL: https://www.aspectmarketingsolutions.app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify worker secret
        shell: bash
        run: |
          test -n "$AMS_MEDIA_WORKER_KEY" || { echo "Worker secret not configured; exiting safely."; exit 0; }

      - name: Install FFmpeg
        if: ${{ env.AMS_MEDIA_WORKER_KEY != '' }}
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Claim render job
        if: ${{ env.AMS_MEDIA_WORKER_KEY != '' }}
        id: claim
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail-with-body --silent --show-error             -X POST             -H "Authorization: Bearer $AMS_MEDIA_WORKER_KEY"             "$AMS_APP_URL/api/internal/twitch/media/render/next")"
          job_id="$(printf '%s' "$response" | jq -r '.job.jobId // empty')"
          if [ -z "$job_id" ]; then
            echo "No pending Short render job."
            echo "has_job=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s' "$response" > "$RUNNER_TEMP/claim.json"
          echo "has_job=true" >> "$GITHUB_OUTPUT"
          echo "job_id=$job_id" >> "$GITHUB_OUTPUT"

      - name: Download source and prepare metadata
        if: steps.claim.outputs.has_job == 'true'
        shell: bash
        run: |
          set -euo pipefail
          source_url="$(jq -r '.source.url' "$RUNNER_TEMP/claim.json")"
          jq '.job.shortDraft | {hook, caption}' "$RUNNER_TEMP/claim.json" > "$RUNNER_TEMP/metadata.json"
          curl --fail-with-body --silent --show-error "$source_url" -o "$RUNNER_TEMP/source.mp4"

      - name: Render 9x16 Short
        if: steps.claim.outputs.has_job == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/render_twitch_short.py             --input "$RUNNER_TEMP/source.mp4"             --output "$RUNNER_TEMP/short.mp4"             --metadata "$RUNNER_TEMP/metadata.json"
          ffprobe -v error -select_streams v:0             -show_entries stream=width,height             -of json "$RUNNER_TEMP/short.mp4"             | jq -e '.streams[0].width == 1080 and .streams[0].height == 1920' >/dev/null

      - name: Upload rendered Short
        if: steps.claim.outputs.has_job == 'true'
        shell: bash
        run: |
          set -euo pipefail
          output_url="$(jq -r '.output.url' "$RUNNER_TEMP/claim.json")"
          curl --fail-with-body --silent --show-error             -X PUT             -H "Content-Type: video/mp4"             --data-binary @"$RUNNER_TEMP/short.mp4"             "$output_url"

      - name: Complete render job
        if: steps.claim.outputs.has_job == 'true'
        shell: bash
        run: |
          set -euo pipefail
          jq -n --arg jobId "${{ steps.claim.outputs.job_id }}"             '{jobId:$jobId,ok:true}' > "$RUNNER_TEMP/result.json"
          curl --fail-with-body --silent --show-error             -X POST             -H "Authorization: Bearer $AMS_MEDIA_WORKER_KEY"             -H "Content-Type: application/json"             --data-binary @"$RUNNER_TEMP/result.json"             "$AMS_APP_URL/api/internal/twitch/media/render/complete"

      - name: Record failed render
        if: failure() && steps.claim.outputs.has_job == 'true'
        shell: bash
        run: |
          jq -n --arg jobId "${{ steps.claim.outputs.job_id }}"             '{jobId:$jobId,ok:false,errorCode:"GITHUB_ACTIONS_RENDER_FAILED"}' > "$RUNNER_TEMP/failure.json"
          curl --silent --show-error             -X POST             -H "Authorization: Bearer $AMS_MEDIA_WORKER_KEY"             -H "Content-Type: application/json"             --data-binary @"$RUNNER_TEMP/failure.json"             "$AMS_APP_URL/api/internal/twitch/media/render/complete" || true
