name: Twitch Short Render Worker
# A worker-file change on main triggers an immediate reconciliation.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/twitch-short-render-worker.yml"
      - "lib/server/twitch-auto-factory.ts"
      - "lib/server/twitch-short-render-jobs.ts"
      - "lib/server/twitch-video-analysis.ts"
      - "lib/server/twitch-creator-copy.ts"
      - "lib/server/youtube-private-uploader.ts"
      - "lib/server/youtube-public-promoter.ts"
      - "app/api/internal/twitch/media/render/youtube/route.ts"
      - "app/api/internal/twitch/media/render/youtube/auto/route.ts"
      - "app/api/internal/twitch/media/render/youtube/public/auto/route.ts"
      - "scripts/render_twitch_short.py"
  schedule:
    - cron: "17,47 * * * *"

permissions:
  contents: read
  id-token: write

concurrency:
  group: twitch-short-render-worker
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      AMS_APP_URL: https://www.aspectmarketingsolutions.app
      AMS_WORKER_AUDIENCE: ams-twitch-worker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Wait for matching AMS production deployment
        shell: bash
        run: |
          set -euo pipefail
          expected_commit="${GITHUB_SHA:0:12}"
          health_file="$RUNNER_TEMP/ams-production-health.json"
          matched=false

          for attempt in $(seq 1 60); do
            http_code="$(curl --max-time 15 --silent --show-error \
              --output "$health_file" \
              --write-out "%{http_code}" \
              "$AMS_APP_URL/api/health" || true)"
            actual_commit="$(jq -r '.commit // "unknown"' "$health_file" 2>/dev/null || printf 'unknown')"

            if [ "$http_code" = "200" ] && [ "$actual_commit" = "$expected_commit" ]; then
              echo "AMS production matches workflow commit $expected_commit."
              matched=true
              break
            fi

            echo "Production not ready for this worker yet (attempt $attempt/60, http=$http_code, commit=$actual_commit, expected=$expected_commit)."
            sleep 5
          done

          if [ "$matched" != "true" ]; then
            echo "::error::AMS production did not reach workflow commit $expected_commit. Twitch/YouTube automation was not executed."
            exit 1
          fi

      - name: Reconcile automatic private Shorts
        id: reconcile
        shell: bash
        run: |
          set -euo pipefail
          token_response="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$AMS_WORKER_AUDIENCE")"
          worker_token="$(printf '%s' "$token_response" | jq -r '.value // empty')"
          if [ -z "$worker_token" ]; then
            echo "::error::GitHub OIDC worker token was not issued."
            exit 1
          fi
          echo "::add-mask::$worker_token"

          set +e
          response="$(curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $worker_token" \
            "$AMS_APP_URL/api/internal/twitch/media/auto")"
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "::warning::Twitch automatic reconciliation returned an error: $response"
            echo "needs_verify=false" >> "$GITHUB_OUTPUT"
          else
            printf '%s' "$response" \
              | jq '{ok, skipped, windowHours, vodCount, clipCount, created, verified, pending, expired, analyzed, selected, rejected, selectionBlocked, queued, failureCount:(.failures | length), failures:(.failures // [])}'
            needs_verify="$(printf '%s' "$response" | jq -r 'if ((.created // 0) > 0 or (.pending // 0) > 0) then "true" else "false" end')"
            echo "needs_verify=$needs_verify" >> "$GITHUB_OUTPUT"
            selection_blocked="$(printf '%s' "$response" | jq -r '.selectionBlocked // empty')"
            if [ -n "$selection_blocked" ]; then
              echo "::warning::Shorts found and analyzed, but no clips passed the real-footage quality gate ($selection_blocked). No Shorts were queued; review clip evidence and candidate coverage."
            fi
            skip_reason="$(printf '%s' "$response" | jq -r '.skipped // empty')"
            if [ "$skip_reason" = "TWITCH_RECENT_VODS_NOT_FOUND" ]; then
              echo "No newly completed Twitch VOD in the bounded Shorts recovery window; this is a normal idle cycle, not a published Short."
            fi
          fi

      - name: Verify asynchronous VOD clips
        if: steps.reconcile.outputs.needs_verify == 'true'
        shell: bash
        run: |
          set -euo pipefail
          sleep 65
          token_response="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$AMS_WORKER_AUDIENCE")"
          worker_token="$(printf '%s' "$token_response" | jq -r '.value // empty')"
          if [ -z "$worker_token" ]; then
            echo "::error::GitHub OIDC worker token was not issued."
            exit 1
          fi
          echo "::add-mask::$worker_token"

          response="$(curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $worker_token" \
            "$AMS_APP_URL/api/internal/twitch/media/auto")"
          printf '%s' "$response" \
            | jq '{ok, skipped, windowHours, vodCount, clipCount, created, verified, pending, expired, analyzed, selected, rejected, selectionBlocked, queued, failureCount:(.failures | length), failures:(.failures // [])}'
          selection_blocked="$(printf '%s' "$response" | jq -r '.selectionBlocked // empty')"
          if [ -n "$selection_blocked" ]; then
            echo "::warning::Post-clip verification completed with no qualifying Short ($selection_blocked); nothing was queued for YouTube."
          fi

      - name: Reconcile pending private YouTube upload
        shell: bash
        run: |
          set -euo pipefail
          token_response="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$AMS_WORKER_AUDIENCE")"
          worker_token="$(printf '%s' "$token_response" | jq -r '.value // empty')"
          if [ -z "$worker_token" ]; then
            echo "::warning::GitHub OIDC worker token was not issued for private upload reconciliation."
            exit 0
          fi
          echo "::add-mask::$worker_token"

          set +e
          http_code="$(curl --silent --show-error \
            --output "$RUNNER_TEMP/youtube-reconcile.json" \
            --write-out "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer $worker_token" \
            "$AMS_APP_URL/api/internal/twitch/media/render/youtube/auto")"
          curl_status=$?
          set -e

          response="$(cat "$RUNNER_TEMP/youtube-reconcile.json" 2>/dev/null || true)"
          printf '%s' "$response" \
            | jq '{ok,attempted,verificationAttempted,pendingVerification,skipped,renderJobId,clipId,status,privacyStatus,videoId,channelId,metadataVerified,attempts,reused,code}' || true

          if [ "$curl_status" -ne 0 ] || [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            echo "::warning::Private YouTube upload reconciliation failed with HTTP $http_code; the rendered job remains intact and will be retried."
          fi

      - name: Reconcile verified public YouTube promotion
        shell: bash
        run: |
          set -euo pipefail
          token_response="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$AMS_WORKER_AUDIENCE")"
          worker_token="$(printf '%s' "$token_response" | jq -r '.value // empty')"
          if [ -z "$worker_token" ]; then
            echo "::warning::GitHub OIDC worker token was not issued for public promotion reconciliation."
            exit 0
          fi
          echo "::add-mask::$worker_token"

          set +e
          http_code="$(curl --silent --show-error \
            --output "$RUNNER_TEMP/youtube-public-reconcile.json" \
            --write-out "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer $worker_token" \
            "$AMS_APP_URL/api/internal/twitch/media/render/youtube/public/auto")"
          curl_status=$?
          set -e

          response="$(cat "$RUNNER_TEMP/youtube-public-reconcile.json" 2>/dev/null || true)"
          printf '%s' "$response" \
            | jq '{ok,attempted,skipped,renderJobId,clipId,sourceVideoId,rank,status,privacyStatus,videoId,channelId,attempts,reused,code}' || true

          if [ "$curl_status" -ne 0 ] || [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            echo "::warning::Public YouTube promotion reconciliation returned HTTP $http_code. No duplicate upload is attempted; the verified private video remains intact."
          fi

      - name: Claim render job
        id: claim
        shell: bash
        run: |
          set -euo pipefail
          token_response="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$AMS_WORKER_AUDIENCE")"
          worker_token="$(printf '%s' "$token_response" | jq -r '.value // empty')"
          if [ -z "$worker_token" ]; then
            echo "::error::GitHub OIDC worker token was not issued."
            exit 1
          fi
          echo "::add-mask::$worker_token"

          response="$(curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $worker_token" \
            "$AMS_APP_URL/api/internal/twitch/media/render/next")"
          job_id="$(printf '%s' "$response" | jq -r '.job.jobId // empty')"
          if [ -z "$job_id" ]; then
            echo "No pending Short render job."
            echo "has_job=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s' "$response" > "$RUNNER_TEMP/claim.json"
          echo "has_job=true" >> "$GITHUB_OUTPUT"
          echo "job_id=$job_id" >> "$GITHUB_OUTPUT"

      - name: Install FFmpeg
        if: steps.claim.outputs.has_job == 'true'
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Download source and prepare metadata
        if: steps.claim.outputs.has_job == 'true'
        shell: bash
        run: |
          set -euo pipefail
          source_url="$(jq -r '.source.url' "$RUNNER_TEMP/claim.json")"
          jq '{
            title:(.job.publishMetadata.title // .job.shortDraft.title),
            description:(.job.publishMetadata.description // .job.shortDraft.caption),
            tags:(.job.publishMetadata.tags // []),
            hashtags:(.job.publishMetadata.hashtags // .job.shortDraft.hashtags),
            keywords:(.job.publishMetadata.keywords // []),
            categoryLabel:(.job.publishMetadata.categoryLabel // "Gaming"),
            twitchClipTitle:(.job.publishMetadata.twitchClipTitle // .job.shortDraft.title),
            youtube:(.job.publishMetadata.youtube // null),
            tiktok:(.job.publishMetadata.tiktok // null),
            instagram:(.job.publishMetadata.instagram // null),
            x:(.job.publishMetadata.x // null),
            hook:.job.shortDraft.hook,
            caption:.job.shortDraft.caption,
            bestStartSeconds:(.job.videoAnalysis.bestStartSeconds // null),
            bestEndSeconds:(.job.videoAnalysis.bestEndSeconds // null)
          }' "$RUNNER_TEMP/claim.json" > "$RUNNER_TEMP/metadata.json"
          curl --fail-with-body --silent --show-error "$source_url" -o "$RUNNER_TEMP/source.mp4"

      - name: Render 9x16 Short
        if: steps.claim.outputs.has_job == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/render_twitch_short.py \
            --input "$RUNNER_TEMP/source.mp4" \
            --output "$RUNNER_TEMP/short.mp4" \
            --metadata "$RUNNER_TEMP/metadata.json"
          ffprobe -v error -select_streams v:0 \
            -show_entries stream=width,height \
            -of json "$RUNNER_TEMP/short.mp4" \
            | jq -e '.streams[0].width == 1080 and .streams[0].height == 1920' >/dev/null

      - name: Upload rendered Short
        if: steps.claim.outputs.has_job == 'true'
        shell: bash
        run: |
          set -euo pipefail
          output_url="$(jq -r '.output.url' "$RUNNER_TEMP/claim.json")"
          curl --fail-with-body --silent --show-error \
            -X PUT \
            -H "Content-Type: video/mp4" \
            --data-binary @"$RUNNER_TEMP/short.mp4" \
            "$output_url"

      - name: Complete render job
        id: complete
        if: steps.claim.outputs.has_job == 'true'
        shell: bash
        run: |
          set -euo pipefail
          token_response="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$AMS_WORKER_AUDIENCE")"
          worker_token="$(printf '%s' "$token_response" | jq -r '.value // empty')"
          if [ -z "$worker_token" ]; then
            echo "::error::GitHub OIDC worker token was not issued."
            exit 1
          fi
          echo "::add-mask::$worker_token"

          jq -n --arg jobId "${{ steps.claim.outputs.job_id }}" \
            '{jobId:$jobId,ok:true}' > "$RUNNER_TEMP/result.json"
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $worker_token" \
            -H "Content-Type: application/json" \
            --data-binary @"$RUNNER_TEMP/result.json" \
            "$AMS_APP_URL/api/internal/twitch/media/render/complete"


      - name: Upload completed Short privately to YouTube
        if: steps.claim.outputs.has_job == 'true' && steps.complete.outcome == 'success'
        id: private_upload
        shell: bash
        run: |
          set -euo pipefail
          token_response="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$AMS_WORKER_AUDIENCE")"
          worker_token="$(printf '%s' "$token_response" | jq -r '.value // empty')"
          if [ -z "$worker_token" ]; then
            echo "::error::GitHub OIDC worker token was not issued."
            exit 1
          fi
          echo "::add-mask::$worker_token"

          jq -n --arg renderJobId "${{ steps.claim.outputs.job_id }}" \
            '{renderJobId:$renderJobId,approved:true}' > "$RUNNER_TEMP/youtube-upload.json"

          set +e
          http_code="$(curl --silent --show-error \
            --output "$RUNNER_TEMP/youtube-response.json" \
            --write-out "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer $worker_token" \
            -H "Content-Type: application/json" \
            --data-binary @"$RUNNER_TEMP/youtube-upload.json" \
            "$AMS_APP_URL/api/internal/twitch/media/render/youtube")"
          curl_status=$?
          set -e

          response="$(cat "$RUNNER_TEMP/youtube-response.json" 2>/dev/null || true)"
          printf '%s' "$response" \
            | jq '{ok,pendingVerification,status,privacyStatus,videoId,channelId,channelVerified,reused,metadataVerified,categoryId,notifySubscribers,notificationEvidence,verificationSource,verifiedAt,code}' || true
          echo "Private YouTube upload HTTP status: $http_code"

          if [ "$curl_status" -ne 0 ] || [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            echo "::error::Private YouTube upload failed with HTTP $http_code. The render stays complete and the next worker run will retry the upload."
            exit 1
          fi

          if [ "$http_code" -eq 202 ]; then
            printf '%s' "$response" | jq -e '.pendingVerification == true and .status == "succeeded" and .privacyStatus == "private" and .channelId == "UCPbMNjvwKOtuFX-1rAtCJSg" and .channelVerified == true and .code == "YOUTUBE_UPLOAD_METADATA_TAGS_MISMATCH" and (.videoId | type == "string" and length > 0)' >/dev/null
            echo "verification_pending=true" >> "$GITHUB_OUTPUT"
            echo "::warning::Private YouTube upload is verified Private, but tags need readback; retry the same video without re-uploading."
            exit 0
          fi

          printf '%s' "$response" | jq -e '.ok == true and .status == "succeeded" and .privacyStatus == "private" and .channelId == "UCPbMNjvwKOtuFX-1rAtCJSg" and .channelVerified == true and .metadataVerified == true and .categoryId == "20" and .notifySubscribers == false and .verificationSource == "youtube-data-api" and (.videoId | type == "string" and length > 0)' >/dev/null
          echo "verified=true" >> "$GITHUB_OUTPUT"

      # Bounded same-run follow-up after a successful-but-not-yet-proven
      # private upload. The endpoint is verification-only: no videos.insert,
      # metadata update, privacy change, or new publish selection.
      - name: Retry private metadata verification without upload
        id: verify_retry
        if: steps.private_upload.outputs.verification_pending == 'true'
        shell: bash
        run: |
          set -euo pipefail
          token_response="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$AMS_WORKER_AUDIENCE")"
          worker_token="$(printf '%s' "$token_response" | jq -r '.value // empty')"
          if [ -z "$worker_token" ]; then
            echo "::error::GitHub OIDC token missing for read-only YouTube verification."
            exit 1
          fi
          echo "::add-mask::$worker_token"

          # The initial HTTP 202 was accepted only after validating identity,
          # success state, exact channel, and known tag-only pending code.
          initial_video_id="$(jq -r '.videoId // empty' "$RUNNER_TEMP/youtube-response.json")"
          if [ -z "$initial_video_id" ]; then
            echo "::error::Verified private video ID missing."
            exit 1
          fi
          jq '{renderJobId}' "$RUNNER_TEMP/youtube-upload.json" > "$RUNNER_TEMP/youtube-verify-request.json"

          for delay in 10 20 30; do
            sleep "$delay"
            set +e
            http_code="$(curl --silent --show-error \
              --output "$RUNNER_TEMP/youtube-verify-response.json" \
              --write-out "%{http_code}" \
              -X POST \
              -H "Authorization: Bearer $worker_token" \
              -H "Content-Type: application/json" \
              --data-binary @"$RUNNER_TEMP/youtube-verify-request.json" \
              "$AMS_APP_URL/api/internal/twitch/media/render/youtube/verify")"
            curl_status=$?
            set -e
            response="$(cat "$RUNNER_TEMP/youtube-verify-response.json" 2>/dev/null || true)"
            printf '%s' "$response" | jq '{ok,pendingVerification,privacyStatus,videoId,channelId,metadataVerified,tagVerification,code}' || true

            if [ "$curl_status" -ne 0 ]; then
              echo "::warning::Read-only metadata verification request failed; next scheduled worker can reconcile the existing upload."
              exit 0
            fi
            if [ "$http_code" = "202" ]; then
              printf '%s' "$response" | jq -e --arg videoId "$initial_video_id" \
                '.ok == false and .pendingVerification == true and .status == "succeeded" and .privacyStatus == "private" and .channelId == "UCPbMNjvwKOtuFX-1rAtCJSg" and .videoId == $videoId and .code == "YOUTUBE_UPLOAD_METADATA_TAGS_MISMATCH"' >/dev/null
              continue
            fi
            if [ "$http_code" = "200" ]; then
              printf '%s' "$response" | jq -e --arg videoId "$initial_video_id" \
                '.ok == true and .pendingVerification == false and .status == "succeeded" and .privacyStatus == "private" and .channelId == "UCPbMNjvwKOtuFX-1rAtCJSg" and .channelVerified == true and .videoId == $videoId and .metadataVerified == true and .categoryId == "20" and .notifySubscribers == false and .verificationSource == "youtube-data-api"' >/dev/null
              echo "verified=true" >> "$GITHUB_OUTPUT"
              echo "Existing Private Short metadata verified through read-only retry."
              exit 0
            fi
            echo "::warning::Read-only video verification returned HTTP $http_code; no public promotion attempted for this Short."
            exit 0
          done
          echo "::warning::YouTube tags still pending after bounded readback; preserve Private and retry during scheduled reconciliation."

      # Existing auto-publisher independently enforces selected clips, channel
      # match, verified Private proof, idempotency and 3-per-stream cap.
      - name: Attempt same-run guarded Public promotion
        if: steps.private_upload.outputs.verified == 'true' || steps.verify_retry.outputs.verified == 'true'
        shell: bash
        run: |
          set -euo pipefail
          token_response="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$AMS_WORKER_AUDIENCE")"
          worker_token="$(printf '%s' "$token_response" | jq -r '.value // empty')"
          [ -n "$worker_token" ] || exit 1
          echo "::add-mask::$worker_token"

          set +e
          http_code="$(curl --silent --show-error \
            --output "$RUNNER_TEMP/youtube-public-after-upload.json" \
            --write-out "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer $worker_token" \
            "$AMS_APP_URL/api/internal/twitch/media/render/youtube/public/auto")"
          curl_status=$?
          set -e
          response="$(cat "$RUNNER_TEMP/youtube-public-after-upload.json" 2>/dev/null || true)"
          printf '%s' "$response" | jq '{ok,attempted,skipped,renderJobId,sourceVideoId,rank,status,privacyStatus,videoId,code}' || true
          if [ "$curl_status" -ne 0 ] || [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            echo "::warning::Guarded Public promotion returned HTTP $http_code; the verified Private video remains for the next scheduled reconciliation."
          fi

      - name: Record failed render
        if: failure() && steps.claim.outputs.has_job == 'true' && steps.complete.outcome != 'success'
        shell: bash
        run: |
          set +e
          token_response="$(curl --silent --show-error \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$AMS_WORKER_AUDIENCE")"
          worker_token="$(printf '%s' "$token_response" | jq -r '.value // empty')"
          [ -n "$worker_token" ] || exit 0
          echo "::add-mask::$worker_token"

          jq -n --arg jobId "${{ steps.claim.outputs.job_id }}" \
            '{jobId:$jobId,ok:false,errorCode:"GITHUB_ACTIONS_RENDER_FAILED"}' > "$RUNNER_TEMP/failure.json"
          curl --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $worker_token" \
            -H "Content-Type: application/json" \
            --data-binary @"$RUNNER_TEMP/failure.json" \
            "$AMS_APP_URL/api/internal/twitch/media/render/complete" || true
