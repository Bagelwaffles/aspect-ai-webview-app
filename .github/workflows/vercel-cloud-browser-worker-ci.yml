name: Vercel Cloud Browser Worker CI

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/vercel-cloud-browser-worker-ci.yml"
      - "tools/vercel-browser-worker/**"
      - "lib/server/cloud-browser-dispatch.ts"
      - "app/api/internal/browser-control/cloud/**"
      - "lib/server/browser-control.ts"
      - "tests/cloud-browser-worker.test.ts"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tools/vercel-browser-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install cloud worker SDK
        run: npm install --no-audit --no-fund
      - name: Syntax check
        run: |
          node --check api/run.js
          node --check api/pair.js
          node --check api/status.js
          node --check lib/auth.js
          node --check lib/sandbox.js
          node --check sandbox/worker.mjs
      - name: Verify pinned runtime packages
        run: |
          node -e 'const p=require("./package.json"); if(p.dependencies["@vercel/sandbox"]!=="3.5.0") process.exit(1)'
          node -e 'const v=require("./vercel.json"); if(v.installCommand!=="npm install --no-audit --no-fund") process.exit(1)'

  lifecycle-proof:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_TEAM: kimberleyaversbiz-4131s-projects
      VERCEL_TEAM_ID: team_tyt9FpAEguBeBOiFqBMO3ZCg
      VERCEL_PROJECT_ID: prj_drTYJyu4QyqebEt3yYnXqhZwG3aC
      SANDBOX_NAME: ams-browser-worker
      ROOT: /vercel/sandbox/ams-browser
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Require existing Vercel credential
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}" || { echo "VERCEL_TOKEN is unavailable"; exit 1; }

      - name: Enforce 90-day snapshot retention
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --request PATCH \
            "https://api.vercel.com/v2/sandboxes/$SANDBOX_NAME?projectId=$VERCEL_PROJECT_ID&teamId=$VERCEL_TEAM_ID" \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            --header "Content-Type: application/json" \
            --data '{"snapshotExpiration":7776000000}' \
            > /tmp/ams-sandbox-retention.json
          node -e 'const fs=require("fs"); const x=JSON.parse(fs.readFileSync("/tmp/ams-sandbox-retention.json","utf8")); if(!x.sandbox) process.exit(2); console.log("snapshotRetentionUpdate=accepted")'

      - name: Verify paired profile before sleep
        shell: bash
        run: |
          set -euo pipefail
          npx --yes vercel@latest sandbox exec "$SANDBOX_NAME"             --project "$VERCEL_PROJECT_ID"             --scope "$VERCEL_TEAM"             --token "$VERCEL_TOKEN"             -- bash -lc '
              set -euo pipefail
              test -f /vercel/sandbox/ams-browser/.browser-runtime-1.62.1-v2
              test -f /vercel/sandbox/ams-browser/credentials.json
              test -d /vercel/sandbox/ams-browser/ChromiumProfile
              STATUS="$(node /vercel/sandbox/ams-browser/worker.mjs status)"
              node -e '"'"'const s=JSON.parse(process.argv[1]); if(!s.paired) process.exit(2); if(!s.profilePresent) process.exit(3); console.log("paired=true profilePresent=true")'"'"' "$STATUS"
              printf "%s\n" "ams-lifecycle-proof" > /vercel/sandbox/ams-browser/.lifecycle-proof
            '

      - name: Sleep named sandbox
        shell: bash
        run: |
          set -euo pipefail
          npx --yes vercel@latest sandbox stop "$SANDBOX_NAME"             --project "$VERCEL_PROJECT_ID"             --scope "$VERCEL_TEAM"             --token "$VERCEL_TOKEN"

      - name: Resume and prove profile persistence
        shell: bash
        run: |
          set -euo pipefail
          npx --yes vercel@latest sandbox exec "$SANDBOX_NAME"             --project "$VERCEL_PROJECT_ID"             --scope "$VERCEL_TEAM"             --token "$VERCEL_TOKEN"             -- bash -lc '
              set -euo pipefail
              test -f /vercel/sandbox/ams-browser/.lifecycle-proof
              test -f /vercel/sandbox/ams-browser/.browser-runtime-1.62.1-v2
              test -f /vercel/sandbox/ams-browser/credentials.json
              test -d /vercel/sandbox/ams-browser/ChromiumProfile
              STATUS="$(node /vercel/sandbox/ams-browser/worker.mjs status)"
              node -e '"'"'const s=JSON.parse(process.argv[1]); if(!s.paired) process.exit(2); if(!s.profilePresent) process.exit(3); console.log("paired=true profilePresent=true after resume")'"'"' "$STATUS"
              rm -f /vercel/sandbox/ams-browser/.lifecycle-proof
            '

      - name: Restore cloud browser daemon
        shell: bash
        run: |
          set -euo pipefail
          npx --yes vercel@latest sandbox exec "$SANDBOX_NAME"             --project "$VERCEL_PROJECT_ID"             --scope "$VERCEL_TEAM"             --token "$VERCEL_TOKEN"             -- bash -lc '
              set -euo pipefail
              export PLAYWRIGHT_BROWSERS_PATH=/vercel/sandbox/ams-browser/ms-playwright
              mkdir -p /vercel/sandbox/ams-browser
              if [ -s /vercel/sandbox/ams-browser/daemon.pid ] && kill -0 "$(cat /vercel/sandbox/ams-browser/daemon.pid)" 2>/dev/null; then
                echo "daemon=already-running"
              else
                nohup node /vercel/sandbox/ams-browser/worker.mjs daemon >> /vercel/sandbox/ams-browser/daemon.log 2>&1 &
                echo $! > /vercel/sandbox/ams-browser/daemon.pid
                sleep 2
                kill -0 "$(cat /vercel/sandbox/ams-browser/daemon.pid)"
                echo "daemon=running"
              fi
            '
