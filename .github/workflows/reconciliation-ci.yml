name: AMS Reconciliation CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ams-reconciliation-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install pnpm
        run: corepack prepare pnpm@10.28.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Dependency audit
        run: pnpm audit --audit-level=high

      - name: TypeScript check
        run: pnpm exec tsc --noEmit

      - name: Production build
        run: pnpm run build

      - name: Runtime security smoke tests
        run: |
          pnpm start > /tmp/ams-next.log 2>&1 &
          APP_PID=$!
          trap 'kill "$APP_PID" 2>/dev/null || true; cat /tmp/ams-next.log' EXIT

          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/api/health > /tmp/health.json; then
              break
            fi
            sleep 1
          done

          node -e 'const value=require("/tmp/health.json"); if(value.ok!==true||value.status!=="ok") process.exit(1)'

          curl --fail --silent http://127.0.0.1:3000/api/agents > /tmp/agents.json
          node -e 'const value=require("/tmp/agents.json"); if(!Array.isArray(value.agents)||value.agents.length!==0) process.exit(1)'

          curl --fail --silent http://127.0.0.1:3000/api/deployments > /tmp/deployments.json
          node -e 'const value=require("/tmp/deployments.json"); if(!Array.isArray(value.deployments)||value.deployments.length!==0) process.exit(1)'

          test "$(curl --silent --output /tmp/relevance.json --write-out '%{http_code}' http://127.0.0.1:3000/api/relevance/agents)" = "401"
          test "$(curl --silent --output /tmp/checkout.json --write-out '%{http_code}' --request POST http://127.0.0.1:3000/api/billing/checkout)" = "401"
          test "$(curl --silent --output /tmp/ai.json --write-out '%{http_code}' --request POST --header 'content-type: application/json' --data '{"message":"test"}' http://127.0.0.1:3000/api/ai/chat)" = "401"
          test "$(curl --silent --output /tmp/grok.json --write-out '%{http_code}' --request POST --header 'content-type: application/json' --data '{"agentId":"grok-content","message":"test"}' http://127.0.0.1:3000/api/grok/chat)" = "401"
          test "$(curl --silent --output /tmp/grok-agents.json --write-out '%{http_code}' http://127.0.0.1:3000/api/grok/agents)" = "401"
          test "$(curl --silent --output /tmp/session.json --write-out '%{http_code}' http://127.0.0.1:3000/api/auth/session)" = "200"
