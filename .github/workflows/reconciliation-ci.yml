name: AMS Reconciliation CI

on:
  pull_request:
    # PR #300 is deliberately stacked; run the SAME reconciliation suite on
    # its current feature base without merging or retargeting it to main.
    branches: [main, feat/ams-branded-audit-sender-20261023]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ams-reconciliation-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      redis:
        image: redis:7.4.10-alpine3.21
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
      redis-rest:
        image: hiett/serverless-redis-http:0.0.10
        env:
          SRH_MODE: env
          SRH_TOKEN: ci-only-redis-rest-token
          SRH_CONNECTION_STRING: redis://redis:6379
          SRH_MAX_CONNECTIONS: 10
        ports:
          - 8079:80

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate isolated staging topology
        run: |
          cp .env.staging.example .env.staging
          docker compose --env-file .env.staging -f docker-compose.staging.yml config --format json > /tmp/ams-compose.json
          node -e '
            const config = require("/tmp/ams-compose.json");
            const names = Object.keys(config.services).sort();
            if (JSON.stringify(names) !== JSON.stringify(["redis", "redis-rest", "web"])) process.exit(1);
            if (config.services.redis.ports || config.services["redis-rest"].ports) process.exit(1);
            if (!config.services.redis.volumes?.length) process.exit(1);
            if (!config.services.web.ports?.every((port) => port.host_ip === "127.0.0.1")) process.exit(1);
            if (Object.values(config.services).some((service) => service.image?.endsWith(":latest"))) process.exit(1);
          '

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install pnpm
        run: corepack prepare pnpm@10.28.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Dependency audit
        shell: bash
        run: |
          set -euo pipefail
          # GHSA-vfj7-8cjw-p6xm is an unfixed braces<=3.0.3 advisory currently
          # reachable only through the eslint-config-next dev-tooling chain.
          # Keep every other high/critical advisory blocking, and separately
          # require the production dependency graph to pass with no exceptions.
          pnpm audit --audit-level=high --ignore GHSA-vfj7-8cjw-p6xm
          pnpm audit --prod --audit-level=high

      - name: Twitch media worker syntax check
        run: python3 -m py_compile scripts/twitch_vod_worker.py scripts/render_twitch_vod.py

      - name: TypeScript check
        run: pnpm exec tsc --noEmit

      - name: Lint
        run: pnpm lint

      - name: Application tests
        run: pnpm test

      - name: Production build
        # Next.js middleware can read build-time env substitutions. Compile
        # synthetic CI with the same Preview scope used by the HTTP guard.
        # No Vercel/Stripe/Resend secrets or live service connections.
        env:
          VERCEL_ENV: preview
          VERCEL_GIT_COMMIT_REF: feat/ams-resend-transactional-preview-20261023
          AMS_STRIPE_PILOT_INGRESS_LOCKDOWN: "true"
        run: pnpm run build

      - name: Staging container runtime smoke tests
        run: |
          cp .env.staging.example .env.staging
          docker compose --env-file .env.staging -f docker-compose.staging.yml up --build -d

          cleanup() {
            docker compose --env-file .env.staging -f docker-compose.staging.yml logs --no-color || true
            docker compose --env-file .env.staging -f docker-compose.staging.yml down || true
          }
          trap cleanup EXIT

          for attempt in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:3000/api/health > /tmp/compose-health.json; then
              break
            fi
            sleep 2
          done

          node -e 'const value=require("/tmp/compose-health.json"); if(value.ok!==true||value.persistence?.redis?.status!=="ready") process.exit(1)'

          docker compose --env-file .env.staging -f docker-compose.staging.yml exec -T redis redis-cli SET ams:ci:persistence-check verified
          docker compose --env-file .env.staging -f docker-compose.staging.yml restart redis
          for attempt in $(seq 1 60); do
            if docker compose --env-file .env.staging -f docker-compose.staging.yml exec -T redis redis-cli PING | grep -q PONG; then
              break
            fi
            sleep 1
          done
          test "$(docker compose --env-file .env.staging -f docker-compose.staging.yml exec -T redis redis-cli GET ams:ci:persistence-check)" = "verified"
          docker compose --env-file .env.staging -f docker-compose.staging.yml exec -T redis redis-cli DEL ams:ci:persistence-check

          docker compose --env-file .env.staging -f docker-compose.staging.yml stop redis
          test "$(curl --silent --output /tmp/compose-health-down.json --write-out '%{http_code}' http://127.0.0.1:3000/api/health)" = "503"
          node -e 'const value=require("/tmp/compose-health-down.json"); if(value.ok!==false||value.persistence?.redis?.status==="ready") process.exit(1)'

          docker compose --env-file .env.staging -f docker-compose.staging.yml start redis
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/api/health > /tmp/compose-health-restored.json; then
              break
            fi
            sleep 2
          done
          node -e 'const value=require("/tmp/compose-health-restored.json"); if(value.ok!==true||value.persistence?.redis?.status!=="ready") process.exit(1)'

      - name: Runtime security smoke tests
        env:
          NEXTAUTH_SECRET: ci-only-placeholder-secret-not-for-production
          NEXTAUTH_URL: http://127.0.0.1:3000
          UPSTASH_REDIS_REST_URL: http://127.0.0.1:8079
          UPSTASH_REDIS_REST_TOKEN: ci-only-redis-rest-token
        run: |
          pnpm start > /tmp/ams-next.log 2>&1 &
          APP_PID=$!
          trap 'kill "$APP_PID" 2>/dev/null || true; cat /tmp/ams-next.log' EXIT

          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/api/health > /tmp/health.json; then
              break
            fi
            sleep 1
          done

          node -e 'const value=require("/tmp/health.json"); if(value.ok!==true||value.status!=="ready"||value.persistence?.redis?.status!=="ready") process.exit(1)'
          test "$(curl --silent --output /tmp/agents.json --write-out '%{http_code}' http://127.0.0.1:3000/api/agents)" = "401"
          node -e 'const value=require("/tmp/agents.json"); if(value.code!=="INTERNAL_API_AUTH_REQUIRED") process.exit(1)'
          test "$(curl --silent --output /tmp/deployments.json --write-out '%{http_code}' http://127.0.0.1:3000/api/deployments)" = "401"
          node -e 'const value=require("/tmp/deployments.json"); if(value.code!=="INTERNAL_API_AUTH_REQUIRED") process.exit(1)'
          test "$(curl --silent --output /tmp/relevance.json --write-out '%{http_code}' http://127.0.0.1:3000/api/relevance/agents)" = "401"
          test "$(curl --silent --output /tmp/checkout.json --write-out '%{http_code}' --request POST http://127.0.0.1:3000/api/billing/checkout)" = "401"
          test "$(curl --silent --output /tmp/portal.json --write-out '%{http_code}' --request POST http://127.0.0.1:3000/api/billing/portal)" = "401"
          test "$(curl --silent --output /tmp/ai.json --write-out '%{http_code}' --request POST --header 'content-type: application/json' --data '{"message":"test"}' http://127.0.0.1:3000/api/ai/chat)" = "401"
          test "$(curl --silent --output /tmp/grok.json --write-out '%{http_code}' --request POST --header 'content-type: application/json' --data '{"agentId":"grok-content","message":"test"}' http://127.0.0.1:3000/api/grok/chat)" = "401"
          test "$(curl --silent --output /tmp/grok-stream.json --write-out '%{http_code}' --request POST --header 'content-type: application/json' --data '{"agentId":"grok-content","message":"test"}' http://127.0.0.1:3000/api/grok/stream)" = "401"
          test "$(curl --silent --output /tmp/grok-agents.json --write-out '%{http_code}' http://127.0.0.1:3000/api/grok/agents)" = "401"
          test "$(curl --silent --output /tmp/entitlements.json --write-out '%{http_code}' http://127.0.0.1:3000/api/account/entitlements)" = "401"
          test "$(curl --silent --output /tmp/content-agent-list.json --write-out '%{http_code}' http://127.0.0.1:3000/api/content-agent/runs)" = "401"
          test "$(curl --silent --output /tmp/content-agent-run.json --write-out '%{http_code}' --request POST --header 'content-type: application/json' --data '{"businessName":"CI Test","audience":"CI audience","goal":"CI test goal","channel":"social","tone":"professional"}' http://127.0.0.1:3000/api/content-agent/runs)" = "401"
          test "$(curl --silent --output /tmp/agent-deploy.json --write-out '%{http_code}' --request POST --header 'content-type: application/json' --data '{}' http://127.0.0.1:3000/api/agents/deploy)" = "401"
          test "$(curl --silent --output /tmp/relevance-run.json --write-out '%{http_code}' --request POST --header 'content-type: application/json' --data '{}' http://127.0.0.1:3000/api/relevance/agents/ci-agent/run)" = "401"
          test "$(curl --silent --output /tmp/one-time-checkout.json --write-out '%{http_code}' --request POST http://127.0.0.1:3000/api/ethical-agent-farm/checkout)" = "410"
          node -e 'const value=require("/tmp/one-time-checkout.json"); if(value.code!=="ONE_TIME_CHECKOUT_DISABLED") process.exit(1)'
          test "$(curl --silent --output /tmp/session.json --write-out '%{http_code}' http://127.0.0.1:3000/api/auth/session)" = "200"

      - name: Preview-only webhook hostname HTTP guard smoke
        env:
          NEXTAUTH_SECRET: ci-only-placeholder-secret-not-for-production
          NEXTAUTH_URL: http://127.0.0.1:3101
          PORT: "3101"
          VERCEL_ENV: preview
          VERCEL_GIT_COMMIT_REF: feat/ams-resend-transactional-preview-20261023
          AMS_STRIPE_PILOT_INGRESS_LOCKDOWN: "true"
          AMS_STRIPE_PILOT_WEBHOOK_INTAKE_ENABLED: "false"
        run: |
          set -euo pipefail
          pnpm start > /tmp/ams-webhook-host-guard.log 2>&1 &
          APP_PID=$!
          trap 'kill "$APP_PID" 2>/dev/null || true; cat /tmp/ams-webhook-host-guard.log' EXIT

          # Separate port is mandatory: the preceding smoke step may leave
          # a child Next.js process on 3000 when its pnpm wrapper exits.
          ready="false"
          for attempt in $(seq 1 40); do
            # A branch-wide lockdown intentionally returns HTTP 404 for "/".
            # An HTTP response still proves the Next server accepted the TCP request.
            if curl --silent --show-error --max-time 5 --output /dev/null http://127.0.0.1:3101/; then
              ready="true"
              break
            fi
            sleep 1
          done
          test "$ready" = "true"

          # Resolve hostname locally only. No external DNS or Vercel exposure.
          INGRESS_HOST="aspect-ai-overlord-git-716b96-kimberleyaversbiz-4131s-projects.vercel.app"
          expect_denied() {
            local path="$1"
            local method="${2:-GET}"
            local response_headers
            response_headers="$(mktemp)"
            local status
            status="$(curl --silent --max-time 15 --request "$method" \
              --noproxy '*' --resolve "$INGRESS_HOST:3101:127.0.0.1" \
              --header "Host: $INGRESS_HOST" \
              --dump-header "$response_headers" --output /dev/null \
              --write-out '%{http_code}' "http://$INGRESS_HOST:3101$path")"
            local guard_header="missing"
            if grep -Eqi '^x-robots-tag: noindex, nofollow' "$response_headers"; then
              guard_header="present"
            fi
            printf 'HOST_GUARD_DIAGNOSTIC method=%s path=%s status=%s guard_header=%s\n' "$method" "$path" "$status" "$guard_header"
            test "$status" = "404"
            test "$guard_header" = "present"
            rm -f "$response_headers"
          }
          expect_denied /
          expect_denied /owner/resend-preview
          expect_denied /api/auth/session
          expect_denied /api/internal/quick-audit-pilot-dispatch POST
          expect_denied /api/internal/quick-audit-stripe-pilot GET
          expect_denied /api/internal/quick-audit-stripe-pilot?test=1 POST
          expect_denied /_next/static/nonexistent.js
          expect_denied /favicon.ico
          expect_denied /api/internal/quick-audit-stripe-pilot OPTIONS

          # Exactly one allowed route reaches the existing fail-closed handler.
          # Intake is OFF, so this unsigned local POST must not be accepted.
          status="$(curl --silent --max-time 15 --request POST \
            --noproxy '*' --resolve "$INGRESS_HOST:3101:127.0.0.1" \
            --header "Host: $INGRESS_HOST" \
            --output /dev/null --write-out '%{http_code}' \
            "http://$INGRESS_HOST:3101/api/internal/quick-audit-stripe-pilot")"
          printf 'HOST_GUARD_DIAGNOSTIC method=POST path=/api/internal/quick-audit-stripe-pilot status=%s\n' "$status"
          test "$status" = "503"
