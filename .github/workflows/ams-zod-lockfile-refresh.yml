name: AMS Zod secure lockfile regeneration (temporary)

on:
  push:
    branches:
      - fix/ams-zod-4-6-7-security-20261023
    paths:
      - package.json
      - .github/workflows/ams-zod-lockfile-refresh.yml

permissions:
  contents: write

jobs:
  regenerate:
    if: github.repository == 'Bagelwaffles/aspect-ai-webview-app'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout isolated security branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enable Corepack and pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.28.0 --activate
      - name: Regenerate lockfile from npm registry without scripts
        run: pnpm install --lockfile-only --ignore-scripts
      - name: Verify patched Zod and Next versions
        run: |
          node -e 'const p=require("./package.json"); if(p.dependencies.zod!=="4.6.7"||p.dependencies.next!=="15.5.28")process.exit(1)'
          grep -q 'specifier: 4.6.7' pnpm-lock.yaml
          grep -q 'zod@4.6.7' pnpm-lock.yaml
          git diff --exit-code -- package.json
      - name: Commit regenerated lockfile only
        shell: bash
        run: |
          set -euo pipefail
          test -n "$(git status --porcelain -- pnpm-lock.yaml)" || { echo "No lockfile change"; exit 1; }
          git add -- pnpm-lock.yaml
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix(security): regenerate lockfile for Zod 4.6.7'
          git push origin HEAD:refs/heads/fix/ams-zod-4-6-7-security-20261023
