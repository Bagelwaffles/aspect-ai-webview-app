name: Repair AMS production Redis

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/repair-production-redis.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ams-production-redis-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      VERCEL_ORG_ID: team_tyt9FpAEguBeBOiFqBMO3ZCg
      VERCEL_PROJECT_ID: prj_ovsfsfElhC0eywpVlk3dHSBi4qFZ
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require deployment credential
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::VERCEL_TOKEN is not configured."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Pull production environment
        run: npx --yes vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Verify replacement Redis before cutover
        shell: bash
        run: |
          set -euo pipefail
          set +x
          set -a
          source .vercel/.env.production.local
          set +a
          : "${AMS_REDIS_KV_REST_API_URL:?replacement Redis URL missing}"
          : "${AMS_REDIS_KV_REST_API_TOKEN:?replacement Redis token missing}"
          host=$(node -e 'console.log(new URL(process.argv[1]).hostname)' "$AMS_REDIS_KV_REST_API_URL")
          code=$(curl --max-time 8 --silent --show-error --output /tmp/redis-new.json --write-out '%{http_code}' \
            -H "Authorization: Bearer $AMS_REDIS_KV_REST_API_TOKEN" \
            "${AMS_REDIS_KV_REST_API_URL%/}/ping")
          if [ "$code" != "200" ] || ! grep -qi 'PONG' /tmp/redis-new.json; then
            echo "::error::Replacement Redis failed readiness check ($host, HTTP $code)."
            exit 1
          fi
          echo "Replacement Redis verified ($host, HTTP 200/PONG)."

      - name: Upsert canonical Redis variables through Vercel API
        shell: bash
        run: |
          set -euo pipefail
          set +x
          set -a
          source .vercel/.env.production.local
          set +a
          node - <<'NODE'
          const required = [
            'VERCEL_TOKEN',
            'VERCEL_PROJECT_ID',
            'VERCEL_ORG_ID',
            'AMS_REDIS_KV_REST_API_URL',
            'AMS_REDIS_KV_REST_API_TOKEN',
          ]
          for (const name of required) {
            if (!process.env[name]) throw new Error(`Missing ${name}`)
          }

          const endpoint = new URL(`https://api.vercel.com/v10/projects/${process.env.VERCEL_PROJECT_ID}/env`)
          endpoint.searchParams.set('teamId', process.env.VERCEL_ORG_ID)
          endpoint.searchParams.set('upsert', 'true')

          const body = [
            {
              key: 'UPSTASH_REDIS_REST_URL',
              value: process.env.AMS_REDIS_KV_REST_API_URL,
              type: 'sensitive',
              target: ['production'],
              comment: 'AMS production Redis replacement managed via Vercel Upstash integration',
            },
            {
              key: 'UPSTASH_REDIS_REST_TOKEN',
              value: process.env.AMS_REDIS_KV_REST_API_TOKEN,
              type: 'sensitive',
              target: ['production'],
              comment: 'AMS production Redis replacement managed via Vercel Upstash integration',
            },
          ]

          const response = await fetch(endpoint, {
            method: 'POST',
            headers: {
              authorization: `Bearer ${process.env.VERCEL_TOKEN}`,
              'content-type': 'application/json',
            },
            body: JSON.stringify(body),
          })

          if (!response.ok) {
            console.error(`Vercel environment upsert failed with HTTP ${response.status}`)
            process.exit(1)
          }

          console.log('Canonical Redis variables upserted for production as sensitive values.')
          console.log('Vercel intentionally masks sensitive values in env pull; runtime health is the verification source.')
          NODE

      - name: Deploy repaired production configuration
        run: npx --yes vercel@latest deploy --prod --yes --token="$VERCEL_TOKEN"

      - name: Verify production health
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6 7 8; do
            code=$(curl --max-time 12 --silent --show-error --output /tmp/health.json --write-out '%{http_code}' \
              https://www.aspectmarketingsolutions.app/api/health || true)
            if [ "$code" = "200" ]; then
              node - <<'NODE'
              const fs = require('fs')
              const health = JSON.parse(fs.readFileSync('/tmp/health.json', 'utf8'))
              console.log(`Production health: ${health.status}`)
              console.log(`Redis: ${health.persistence?.redis?.status}`)
              console.log(`Redis configured: ${health.persistence?.redis?.configured}`)
              console.log(`Redis checked: ${health.persistence?.redis?.checked}`)
              console.log(`Environment: ${health.environment}`)
              console.log(`Commit: ${health.commit}`)
              if (health.persistence?.redis?.status !== 'ready') process.exit(2)
              NODE
              exit 0
            fi
            echo "Health attempt $attempt returned HTTP ${code:-transport-error}; waiting for deployment propagation."
            sleep 10
          done
          echo "::error::Production health did not reach HTTP 200 after Redis cutover."
          cat /tmp/health.json 2>/dev/null || true
          exit 1

      - name: Zero-cost safety assertion
        run: |
          echo "Redis remains on the explicitly selected free plan."
          echo "The replacement resource was provisioned with prodPack=false and autoUpgrade=false."
