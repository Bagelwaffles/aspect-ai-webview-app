name: Secret scan

on:
  pull_request:
  push:
    branches:
      - main
      - "security/**"
      - "restore/**"
      - "feat/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tracked-files:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Scan tracked files without printing values
        run: node scripts/scan-secrets.mjs

      - name: Block committed environment and private-key files
        shell: bash
        run: |
          set -euo pipefail
          blocked=$(git ls-files | grep -E '(^|/)(\.env($|\.)|credentials[^/]*\.json$|service-account[^/]*\.json$)|\.(pem|key|p12|pfx|jks)$' | grep -vE '(^|/)\.env(\.staging)?\.example$' || true)
          if [ -n "$blocked" ]; then
            echo "Blocked credential-bearing filenames are tracked:"
            printf '%s\n' "$blocked"
            exit 1
          fi
          echo "No blocked credential-bearing filenames are tracked."
