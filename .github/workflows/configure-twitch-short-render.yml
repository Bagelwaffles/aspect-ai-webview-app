name: Configure Twitch Short Renderer

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/configure-twitch-short-render.yml"
      - ".github/workflows/twitch-short-render-worker.yml"
      - "app/api/internal/twitch/media/render/acceptance/route.ts"

permissions:
  contents: read

concurrency:
  group: configure-twitch-short-renderer
  cancel-in-progress: false

jobs:
  configure-and-accept:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    env:
      VERCEL_ORG_ID: team_tyt9FpAEguBeBOiFqBMO3ZCg
      VERCEL_PROJECT_ID: prj_ovsfsfElhC0eywpVlk3dHSBi4qFZ
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      AMS_APP_URL: https://www.aspectmarketingsolutions.app
      ACCEPTANCE_CLIP_ID: AgreeableLachrymoseYogurtNononoCat-G9Yl5FyYObSzHX2U
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install pnpm
        run: corepack prepare pnpm@10.28.0 --activate

      - name: Require protected Vercel credential
        shell: bash
        run: |
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo "::error::VERCEL_TOKEN is not configured."
            exit 1
          fi

      - name: Pull current production environment
        shell: bash
        run: |
          set -euo pipefail
          npx --yes vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN" >/dev/null

      - name: Enable renderer and configure independent worker key
        shell: bash
        run: |
          set -euo pipefail
          set +x
          set -a
          source .vercel/.env.production.local
          set +a

          current_key="${AMS_MEDIA_WORKER_KEY:-}"
          if [ ${#current_key} -ge 32 ]; then
            worker_key="$current_key"
          else
            worker_key="$(node -e "console.log(require('node:crypto').randomBytes(48).toString('base64url'))")"
          fi
          echo "::add-mask::$worker_key"
          export AMS_MEDIA_WORKER_KEY_VALUE="$worker_key"
          printf 'AMS_MEDIA_WORKER_KEY=%s\n' "$worker_key" >> "$GITHUB_ENV"
          echo 'AMS_TWITCH_SHORT_RENDER_ENABLED=true' >> "$GITHUB_ENV"

          node --input-type=module - <<'NODE'
          const required = ['VERCEL_TOKEN', 'VERCEL_PROJECT_ID', 'VERCEL_ORG_ID', 'AMS_MEDIA_WORKER_KEY_VALUE']
          for (const name of required) {
            if (!process.env[name]) throw new Error(`Missing ${name}`)
          }

          const endpoint = new URL(`https://api.vercel.com/v10/projects/${process.env.VERCEL_PROJECT_ID}/env`)
          endpoint.searchParams.set('teamId', process.env.VERCEL_ORG_ID)
          endpoint.searchParams.set('upsert', 'true')

          const body = [
            {
              key: 'AMS_TWITCH_SHORT_RENDER_ENABLED',
              value: 'true',
              type: 'plain',
              target: ['production'],
              comment: 'Owner-approved Twitch 9:16 renderer enablement',
            },
            {
              key: 'AMS_MEDIA_WORKER_KEY',
              value: process.env.AMS_MEDIA_WORKER_KEY_VALUE,
              type: 'sensitive',
              target: ['production'],
              comment: 'Independent secret for the controlled Twitch render worker',
            },
            {
              key: 'AMS_TWITCH_SHORT_ACCEPTANCE_CLIP_ID',
              value: process.env.ACCEPTANCE_CLIP_ID,
              type: 'plain',
              target: ['production'],
              comment: 'Exact owner-approved clip permitted for controlled renderer acceptance',
            },
          ]

          const response = await fetch(endpoint, {
            method: 'POST',
            headers: {
              authorization: `Bearer ${process.env.VERCEL_TOKEN}`,
              'content-type': 'application/json',
            },
            body: JSON.stringify(body),
          })

          if (!response.ok) {
            console.error(`Vercel renderer configuration failed with HTTP ${response.status}`)
            process.exit(1)
          }
          console.log('Twitch renderer production variables configured without exposing the worker key.')
          NODE

      - name: Refresh production environment
        shell: bash
        run: |
          set -euo pipefail
          set +x
          worker_key="$AMS_MEDIA_WORKER_KEY"
          test ${#worker_key} -ge 32 || { echo "::error::Generated worker key handoff is invalid."; exit 1; }
          npx --yes vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN" >/dev/null
          echo "::add-mask::$worker_key"
          echo "Renderer variables were accepted by Vercel; continuing with the masked in-job key."

      - name: Redeploy production with renderer enabled
        shell: bash
        run: |
          set -euo pipefail
          npx --yes vercel@latest deploy --prod --yes --token="$VERCEL_TOKEN"

      - name: Enqueue owner-approved acceptance clip through production
        id: enqueue
        shell: bash
        run: |
          set -euo pipefail
          jq -n --arg clipId "$ACCEPTANCE_CLIP_ID" '{clipId:$clipId}' > "$RUNNER_TEMP/enqueue-request.json"
          curl --retry 5 --retry-delay 3 --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $AMS_MEDIA_WORKER_KEY" \
            -H "Content-Type: application/json" \
            --data-binary @"$RUNNER_TEMP/enqueue-request.json" \
            "$AMS_APP_URL/api/internal/twitch/media/render/acceptance" \
            > "$RUNNER_TEMP/enqueue.json"
          job_id="$(jq -r '.job.jobId // empty' "$RUNNER_TEMP/enqueue.json")"
          status="$(jq -r '.job.status // empty' "$RUNNER_TEMP/enqueue.json")"
          test -n "$job_id"
          echo "job_id=$job_id" >> "$GITHUB_OUTPUT"
          echo "Acceptance render queued through production with status: $status"

      - name: Install FFmpeg
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Claim acceptance render through production worker API
        id: claim
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --retry 5 --retry-delay 3 --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $AMS_MEDIA_WORKER_KEY" \
            "$AMS_APP_URL/api/internal/twitch/media/render/next")"
          job_id="$(printf '%s' "$response" | jq -r '.job.jobId // empty')"
          if [ -z "$job_id" ]; then
            echo "::error::Production worker API did not return the queued render job."
            exit 1
          fi
          if [ "$job_id" != "${{ steps.enqueue.outputs.job_id }}" ]; then
            echo "::error::Production worker claimed an unexpected render job."
            exit 1
          fi
          printf '%s' "$response" > "$RUNNER_TEMP/claim.json"
          echo "job_id=$job_id" >> "$GITHUB_OUTPUT"

      - name: Download acceptance source
        shell: bash
        run: |
          set -euo pipefail
          source_url="$(jq -r '.source.url' "$RUNNER_TEMP/claim.json")"
          jq '.job.shortDraft | {hook, caption}' "$RUNNER_TEMP/claim.json" > "$RUNNER_TEMP/metadata.json"
          curl --fail-with-body --silent --show-error "$source_url" -o "$RUNNER_TEMP/source.mp4"

      - name: Render and verify 1080x1920
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/render_twitch_short.py \
            --input "$RUNNER_TEMP/source.mp4" \
            --output "$RUNNER_TEMP/short.mp4" \
            --metadata "$RUNNER_TEMP/metadata.json"
          ffprobe -v error -select_streams v:0 \
            -show_entries stream=width,height \
            -of json "$RUNNER_TEMP/short.mp4" \
            | jq -e '.streams[0].width == 1080 and .streams[0].height == 1920' >/dev/null
          echo "Acceptance Short verified at 1080x1920."

      - name: Upload private rendered Short
        shell: bash
        run: |
          set -euo pipefail
          output_url="$(jq -r '.output.url' "$RUNNER_TEMP/claim.json")"
          curl --fail-with-body --silent --show-error \
            -X PUT \
            -H "Content-Type: video/mp4" \
            --data-binary @"$RUNNER_TEMP/short.mp4" \
            "$output_url"

      - name: Complete acceptance render through production worker API
        shell: bash
        run: |
          set -euo pipefail
          jq -n --arg jobId "${{ steps.claim.outputs.job_id }}" \
            '{jobId:$jobId,ok:true}' > "$RUNNER_TEMP/result.json"
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $AMS_MEDIA_WORKER_KEY" \
            -H "Content-Type: application/json" \
            --data-binary @"$RUNNER_TEMP/result.json" \
            "$AMS_APP_URL/api/internal/twitch/media/render/complete" \
            > "$RUNNER_TEMP/complete.json"
          jq -e '.ok == true and .job.status == "rendered"' "$RUNNER_TEMP/complete.json" >/dev/null
          echo "Acceptance Short is rendered and stored privately."

      - name: Acceptance summary
        run: |
          echo "Twitch Short renderer is enabled in production."
          echo "The verified COD acceptance clip rendered at 1080x1920 and remains private."
          echo "Automatic social publishing remains disabled."
