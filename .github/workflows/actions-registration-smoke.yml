name: Actions Registration Smoke

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "scripts/ops/actions-registration-smoke.txt"

permissions:
  contents: read

jobs:
  smoke:
    name: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Confirm GitHub Actions scheduling
        run: echo "GitHub Actions scheduling is enabled for this repository."
