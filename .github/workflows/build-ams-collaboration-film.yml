name: Build AMS Collaboration Film

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install render dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install --upgrade pip
          python -m pip install pillow edge-tts

      - name: Render collaboration film
        run: python scripts/build_ams_collaboration_film.py

      - name: Verify media
        run: |
          test -s dist/collaboration/ams-collaboration-system-film.mp4
          test -s dist/collaboration/ams-collaboration-poster.webp
          test -s dist/collaboration/ams-collaboration-system-film.vtt
          ffprobe -v error -show_entries format=duration,size -show_entries stream=codec_name,width,height,r_frame_rate -of json dist/collaboration/ams-collaboration-system-film.mp4
          cat dist/collaboration/ams-collaboration-system-film-manifest.json

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: ams-collaboration-system-film
          path: dist/collaboration/*
          retention-days: 30
          compression-level: 0

      - name: Publish stable GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG='ams-collaboration-film-v1'
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/collaboration/* --clobber
          else
            gh release create "$TAG" dist/collaboration/* \
              --target "$GITHUB_SHA" \
              --title 'AMS Collaboration System Film v1' \
              --notes 'Public collaboration film and companion assets for the AMS Collaboration Hub. Capability status is intentionally represented as lifecycle status rather than universal production availability.'
          fi

      - name: Persist verified web companion assets
        run: |
          mkdir -p public/collaboration
          cp dist/collaboration/ams-collaboration-poster.webp public/collaboration/ams-collaboration-poster.webp
          cp dist/collaboration/ams-collaboration-system-film.vtt public/collaboration/ams-collaboration-system-film.vtt
          cp dist/collaboration/ams-collaboration-system-film-manifest.json public/collaboration/ams-collaboration-system-film-manifest.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/collaboration/
          if git diff --cached --quiet; then
            echo 'Verified web companion assets already current.'
          else
            git commit -m 'chore: publish verified collaboration film web assets [skip ci]'
            git push origin HEAD:main
          fi
