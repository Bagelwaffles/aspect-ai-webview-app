name: Aiven Preview isolation
on:
  push:
    branches: [feat/owner-gmail-aiven-actions-20261020]
    paths: [.github/workflows/aiven-preview-isolation.yml, scripts/aiven/**, tests/owner-preview-redis.integration.test.ts]
permissions:
  contents: read
concurrency:
  group: aiven-preview-isolation
  cancel-in-progress: false
jobs:
  synthetic:
    if: github.event_name == 'push' && github.repository == 'Bagelwaffles/aspect-ai-webview-app' && github.ref == 'refs/heads/feat/owner-gmail-aiven-actions-20261020'
    environment: ams-aiven-synthetic
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: DNS and TCP without credentials
        run: node scripts/aiven/connectivity.mjs
      - name: Check test credential availability
        env:
          TEST_URL: ${{ secrets.AMS_AIVEN_SYNTHETIC_URL }}
        run: |
          if [ -z "$TEST_URL" ]; then
            echo 'BLOCKED: test-only Aiven secret is not configured; DNS/TCP results remain valid.'
            exit 1
          fi
      - name: Install test dependencies without lifecycle scripts
        run: |
          mkdir -p "$RUNNER_TEMP/aiven-deps"
          npm install --prefix "$RUNNER_TEMP/aiven-deps" --ignore-scripts --no-audit --no-fund ioredis@5.8.2 @upstash/redis@1.36.0 tsx@4.20.6
          ln -s "$RUNNER_TEMP/aiven-deps/node_modules" node_modules
      - name: Synthetic adapter acceptance only
        env:
          AMS_OWNER_VALKEY_URL: ${{ secrets.AMS_AIVEN_SYNTHETIC_URL }}
          AMS_OWNER_VALKEY_CA: ${{ secrets.AMS_AIVEN_SYNTHETIC_CA }}
          AMS_OWNER_PREVIEW_STORE: aiven
          AMS_AIVEN_SYNTHETIC_TEST: 'true'
          VERCEL_ENV: preview
          AMS_GMAIL_SEND_ENABLED: 'false'
          AMS_GMAIL_AUTOREPLY_ENABLED: 'false'
          AMS_SCHEDULED_TASKS_ENABLED: 'false'
        run: node --import tsx --test tests/owner-preview-redis.integration.test.ts
