name: Deploy restored AMS n8n preview

on:
  push:
    branches:
      - restore/ams-n8n-cloud-webhook-client
    paths:
      - ".github/workflows/deploy-preview-restore.yml"
      - ".github/workflows/deploy-preview-n8n.yml"
      - "app/api/health/**"
      - "app/api/internal/n8n/**"
      - "lib/server/ams-n8n-webhook-client.ts"
      - "lib/server/customer-api-auth.ts"
      - "lib/server/rate-limit.ts"
      - "lib/server/redis-readiness.ts"
      - "package.json"
      - "pnpm-lock.yaml"
      - "vercel.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ams-n8n-restored-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VERCEL_ORG_ID: team_tyt9FpAEguBeBOiFqBMO3ZCg
      VERCEL_PROJECT_ID: prj_ovsfsfElhC0eywpVlk3dHSBi4qFZ
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      NEXT_PUBLIC_AMS_CONTENT_AGENT_LIVE: "false"
    steps:
      - name: Checkout restored branch
        uses: actions/checkout@v4

      - name: Require Vercel credential
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo "::error::GitHub secret VERCEL_TOKEN is not configured."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@10.28.0 --activate

      - name: Pull latest Vercel Preview settings
        shell: bash
        run: |
          set -euo pipefail
          npx --yes vercel@latest pull --yes --environment=preview --token="$VERCEL_TOKEN"

      - name: Verify required variable names
        shell: bash
        run: |
          set -euo pipefail
          ENV_FILE=".vercel/.env.preview.local"
          test -f "$ENV_FILE"
          for name in AMS_N8N_URL AMS_N8N_ORCHESTRATOR_WEBHOOK_URL AMS_N8N_INTERNAL_KEY AMS_APP_URL; do
            if ! grep -q "^${name}=" "$ENV_FILE"; then
              echo "::error::Missing required Vercel Preview variable: ${name}"
              exit 1
            fi
          done
          echo "Required Preview variable names are present. Values were not printed."

      - name: Build restored Preview
        shell: bash
        run: |
          set -euo pipefail
          npx --yes vercel@latest build --token="$VERCEL_TOKEN"

      - name: Deploy restored Preview
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          DEPLOYMENT_URL=$(npx --yes vercel@latest deploy --prebuilt --token="$VERCEL_TOKEN")
          echo "deployment_url=$DEPLOYMENT_URL" >> "$GITHUB_OUTPUT"
          echo "Restored Preview deployed successfully."

      - name: Smoke test public and protected routes
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment_url }}
        run: |
          set -euo pipefail
          for path in / /pricing /api/health; do
            code=$(curl -L -sS -o /tmp/preview-response -w '%{http_code}' "$DEPLOYMENT_URL$path")
            echo "$path -> $code"
            case "$code" in
              200|301|302|307|308) ;;
              *) exit 1 ;;
            esac
          done

          gateway_code=$(curl -sS -o /tmp/gateway-response.json -w '%{http_code}' \
            -X POST \
            -H 'content-type: application/json' \
            --data '{"action":"content.plan","payload":{}}' \
            "$DEPLOYMENT_URL/api/internal/n8n/orchestrator")
          echo "/api/internal/n8n/orchestrator unauthenticated -> $gateway_code"
          test "$gateway_code" = "401"

      - name: Verify n8n Header Auth and response contract
        shell: bash
        run: |
          set -euo pipefail
          set +x
          node --import tsx --input-type=module <<'NODE'
          import { readFileSync } from "node:fs"
          import { randomUUID } from "node:crypto"

          const webhookModule = await import("./lib/server/ams-n8n-webhook-client.ts")
          const sendAmsN8nWebhook =
            typeof webhookModule.sendAmsN8nWebhook === "function"
              ? webhookModule.sendAmsN8nWebhook
              : typeof webhookModule.default?.sendAmsN8nWebhook === "function"
                ? webhookModule.default.sendAmsN8nWebhook
                : null

          if (!sendAmsN8nWebhook) {
            throw new Error("sendAmsN8nWebhook export is unavailable")
          }

          const envFile = readFileSync(".vercel/.env.preview.local", "utf8")
          for (const rawLine of envFile.split(/\r?\n/u)) {
            const line = rawLine.trim()
            if (!line || line.startsWith("#")) continue
            const separator = line.indexOf("=")
            if (separator < 1) continue
            const name = line.slice(0, separator)
            let value = line.slice(separator + 1)
            if (value.startsWith('"') && value.endsWith('"')) value = JSON.parse(value)
            process.env[name] = value
          }

          const webhookUrl = process.env.AMS_N8N_ORCHESTRATOR_WEBHOOK_URL?.trim()
          if (!webhookUrl) throw new Error("N8N Preview webhook URL is missing")

          const negativeResponse = await fetch(webhookUrl, {
            method: "POST",
            headers: {
              "content-type": "application/json",
              "x-ams-internal-key": `invalid-preview-key-${randomUUID()}`,
              "x-request-id": randomUUID(),
              "idempotency-key": randomUUID(),
            },
            body: JSON.stringify({
              request_id: randomUUID(),
              action: "status.ping",
              payload: {},
              meta: { source: "ams-restored-preview-negative-auth-check" },
            }),
          })

          if (![401, 403, 404].includes(negativeResponse.status)) {
            throw new Error(`n8n did not reject invalid Header Auth: HTTP ${negativeResponse.status}`)
          }
          console.log(`Invalid n8n Header Auth rejected with HTTP ${negativeResponse.status}.`)

          const requestId = randomUUID()
          const result = await sendAmsN8nWebhook({
            action: "status.ping",
            payload: { probe: "vercel-restored-preview" },
            meta: { test_mode: true },
            requestId,
            idempotencyKey: `restored-preview-${requestId}`,
          })

          if (!result.ok || result.status !== "accepted") {
            const code = result.error?.code ?? "N8N_RESPONSE_REJECTED"
            throw new Error(`Authenticated n8n Preview check failed: ${code}`)
          }
          if (result.action !== "status.ping") {
            throw new Error("n8n response action did not match status.ping")
          }
          console.log("Valid n8n Header Auth request accepted with structured JSON.")
          NODE

      - name: Preview summary
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment_url }}
        run: |
          {
            echo "## Restored AMS n8n Preview"
            echo ""
            echo "- Commit: $GITHUB_SHA"
            echo "- Deployment: $DEPLOYMENT_URL"
            echo "- Required Preview variable names: present"
            echo "- Public smoke tests: passed"
            echo "- Unauthenticated gateway rejection: passed"
            echo "- Invalid n8n Header Auth rejection: passed"
            echo "- Valid n8n Header Auth response contract: passed"
            echo "- Production deployment: not performed"
          } >> "$GITHUB_STEP_SUMMARY"
