name: ams-webview-staging

services:
  redis:
    image: redis:7.4.10-alpine3.21
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
    restart: unless-stopped
    volumes:
      - ams_staging_redis_data:/data
    networks:
      - datastore
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    security_opt:
      - no-new-privileges:true

  redis-rest:
    image: hiett/serverless-redis-http:0.0.10
    restart: unless-stopped
    environment:
      SRH_MODE: env
      SRH_TOKEN: ${AMS_STAGING_REDIS_REST_TOKEN:?set AMS_STAGING_REDIS_REST_TOKEN in .env.staging}
      SRH_CONNECTION_STRING: redis://redis:6379
      SRH_MAX_CONNECTIONS: "10"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - datastore
      - application
    expose:
      - "80"
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 80 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    security_opt:
      - no-new-privileges:true

  web:
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
    restart: unless-stopped
    init: true
    env_file:
      - .env.staging
    environment:
      NODE_ENV: production
      VERCEL_ENV: preview
      UPSTASH_REDIS_REST_URL: http://redis-rest:80
      UPSTASH_REDIS_REST_TOKEN: ${AMS_STAGING_REDIS_REST_TOKEN:?set AMS_STAGING_REDIS_REST_TOKEN in .env.staging}
      KV_REST_API_URL: http://redis-rest:80
      KV_REST_API_TOKEN: ${AMS_STAGING_REDIS_REST_TOKEN:?set AMS_STAGING_REDIS_REST_TOKEN in .env.staging}
    depends_on:
      redis:
        condition: service_healthy
      redis-rest:
        condition: service_healthy
    networks:
      - application
    ports:
      - "127.0.0.1:${AMS_STAGING_WEB_PORT:-3000}:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    security_opt:
      - no-new-privileges:true

networks:
  application:
    internal: false
  datastore:
    internal: true

volumes:
  ams_staging_redis_data:
